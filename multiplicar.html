<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabla del 3 · Aprende multiplicando</title>
  <link rel="stylesheet" href="multiplicar.css">
  <script src="multiplicar.js"></script>
</head>
<body>

  <!-- ===== Burbujas decorativas de fondo ===== -->
  <div class="fondo-decor" aria-hidden="true">
    <span class="burbuja b1"></span>
    <span class="burbuja b2"></span>
    <span class="burbuja b3"></span>
    <span class="burbuja b4"></span>
    <span class="burbuja b5"></span>
    <span class="burbuja b6"></span>
  </div>

  <!-- ===== CABECERA ===== -->
  <header class="cabecera">
    <span class="insignia">✨ Aprende jugando ✨</span>

    <h1 class="titulo">
      Tabla del <span class="destacado">3</span>
    </h1>

    <p class="subtitulo">¡Multiplicar es divertido! 🎒</p>

    <button type="button" class="boton-probar" onclick=" generarTablas()">PROBAR</button>
  </header>

  <!-- ===== CONTENIDO ===== -->
  <main class="contenedor">
    <ul class="tabla" id = "txtTabla">
      <li class="fila"><span class="operacion">3 × 1</span><span class="igual">=</span><span class="resultado">3</span></li>
      <li class="fila"><span class="operacion">3 × 2</span><span class="igual">=</span><span class="resultado">6</span></li>
      <li class="fila"><span class="operacion">3 × 3</span><span class="igual">=</span><span class="resultado">9</span></li>
      <li class="fila"><span class="operacion">3 × 4</span><span class="igual">=</span><span class="resultado">12</span></li>
      <li class="fila"><span class="operacion">3 × 5</span><span class="igual">=</span><span class="resultado">15</span></li>
      <li class="fila"><span class="operacion">3 × 6</span><span class="igual">=</span><span class="resultado">18</span></li>
      <li class="fila"><span class="operacion">3 × 7</span><span class="igual">=</span><span class="resultado">21</span></li>
      <li class="fila"><span class="operacion">3 × 8</span><span class="igual">=</span><span class="resultado">24</span></li>
      <li class="fila"><span class="operacion">3 × 9</span><span class="igual">=</span><span class="resultado">27</span></li>
      <li class="fila"><span class="operacion">3 × 10</span><span class="igual">=</span><span class="resultado">30</span></li>
    </ul>
  </main>

  <!-- ===== PIE · Logo del desarrollador + crédito ===== -->
  <footer class="pie">
    <div class="logo-marco">
      <img src="logo_web.png" alt="Logo del desarrollador" class="logo">
    </div>
    <p class="dev-texto">Desarrollado por <strong>Zahid Nazate</strong></p>
  </footer>

</body>
</html>
